# One compliant pod and one violation per policy, all in the enforced namespace.
apiVersion: v1
kind: Pod
metadata: {name: good, namespace: governed-agent}
spec:
  securityContext: {runAsNonRoot: true}
  containers:
    - name: app
      image: governed-agent-python:v0.1.0
      resources: {requests: {cpu: 50m, memory: 64Mi}, limits: {memory: 128Mi}}
      securityContext: {allowPrivilegeEscalation: false, privileged: false, runAsNonRoot: true}
---
apiVersion: v1
kind: Pod
metadata: {name: bad-latest, namespace: governed-agent}
spec:
  securityContext: {runAsNonRoot: true}
  containers:
    - name: app
      image: governed-agent-python:latest
      resources: {requests: {cpu: 50m, memory: 64Mi}, limits: {memory: 128Mi}}
---
apiVersion: v1
kind: Pod
metadata: {name: bad-untagged, namespace: governed-agent}
spec:
  securityContext: {runAsNonRoot: true}
  containers:
    - name: app
      image: governed-agent-python
      resources: {requests: {cpu: 50m, memory: 64Mi}, limits: {memory: 128Mi}}
---
apiVersion: v1
kind: Pod
metadata: {name: bad-no-resources, namespace: governed-agent}
spec:
  securityContext: {runAsNonRoot: true}
  containers:
    - name: app
      image: governed-agent-python:v0.1.0
---
apiVersion: v1
kind: Pod
metadata: {name: bad-root, namespace: governed-agent}
spec:
  containers:
    - name: app
      image: governed-agent-python:v0.1.0
      resources: {requests: {cpu: 50m, memory: 64Mi}, limits: {memory: 128Mi}}
---
apiVersion: v1
kind: Pod
metadata: {name: bad-privileged, namespace: governed-agent}
spec:
  securityContext: {runAsNonRoot: true}
  containers:
    - name: app
      image: governed-agent-python:v0.1.0
      resources: {requests: {cpu: 50m, memory: 64Mi}, limits: {memory: 128Mi}}
      securityContext: {privileged: true}
---
# Outside the enforced namespace the same violation is not this platform's business.
apiVersion: v1
kind: Pod
metadata: {name: elsewhere-latest, namespace: scratch}
spec:
  containers:
    - name: app
      image: busybox:latest
