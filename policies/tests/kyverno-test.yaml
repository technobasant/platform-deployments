apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: platform-policies
policies:
  - ../../gitops/platform/policies/disallow-latest-tag.yaml
  - ../../gitops/platform/policies/require-requests-limits.yaml
  - ../../gitops/platform/policies/require-run-as-non-root.yaml
  - ../../gitops/platform/policies/disallow-privileged.yaml
resources: [resources.yaml]
variables: values.yaml
results:
  - {policy: disallow-latest-tag, rule: require-explicit-tag, kind: Pod, resources: [good, bad-no-resources, bad-root, bad-privileged], result: pass}
  - {policy: disallow-latest-tag, rule: require-explicit-tag, kind: Pod, resources: [bad-latest, bad-untagged], result: fail}
  - {policy: disallow-latest-tag, rule: require-explicit-tag, kind: Pod, resources: [elsewhere-latest], result: skip}
  - {policy: require-requests-limits, rule: containers-have-resources, kind: Pod, resources: [good, bad-latest, bad-root, bad-privileged], result: pass}
  - {policy: require-requests-limits, rule: containers-have-resources, kind: Pod, resources: [bad-no-resources], result: fail}
  - {policy: require-run-as-non-root, rule: run-as-non-root, kind: Pod, resources: [good, bad-latest, bad-no-resources, bad-privileged], result: pass}
  - {policy: require-run-as-non-root, rule: run-as-non-root, kind: Pod, resources: [bad-root], result: fail}
  - {policy: disallow-privileged, rule: no-privileged, kind: Pod, resources: [good, bad-latest, bad-no-resources, bad-root], result: pass}
  - {policy: disallow-privileged, rule: no-privileged, kind: Pod, resources: [bad-privileged], result: fail}
