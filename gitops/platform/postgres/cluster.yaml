# Two instances: a primary and a streaming replica the operator promotes on failure.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: ga-pg
  namespace: governed-agent
spec:
  instances: 2
  imageName: ghcr.io/cloudnative-pg/postgresql:17.6
  primaryUpdateStrategy: unsupervised
  storage:
    size: 2Gi
  bootstrap:
    initdb:
      database: app
      owner: app
  resources:
    requests: {cpu: 250m, memory: 256Mi}
    limits: {memory: 512Mi}
  # The primary's liveness probe also checks that it can reach the API server and its
  # replica, with 1 s timeouts by default. While the API server was busy during
  # bootstrap, that check failed and the kubelet restarted a healthy primary. Five
  # seconds still catches a real partition within a probe or two.
  probes:
    liveness:
      timeoutSeconds: 12
      periodSeconds: 10
      failureThreshold: 3
      isolationCheck:
        enabled: true
        requestTimeout: 5000
        connectionTimeout: 5000
    readiness:
      timeoutSeconds: 5
  affinity:
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname
    podAntiAffinityType: preferred
  monitoring:
    enablePodMonitor: true
