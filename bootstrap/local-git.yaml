# A Git server inside the cluster, so Argo CD has a repository to read before this
# one is public, and release commits made during measurements never leave the cluster.
apiVersion: v1
kind: Namespace
metadata:
  name: local-git
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: git-data
  namespace: local-git
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: {storage: 256Mi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: git-server
  namespace: local-git
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: git-server}
  template:
    metadata:
      labels: {app: git-server}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: git
          image: local-git-server:0.1.0
          imagePullPolicy: Never
          ports:
            - {name: http, containerPort: 8080}
          readinessProbe:
            tcpSocket: {port: http}
            periodSeconds: 2
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: data, mountPath: /srv}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: git-data}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: git-server
  namespace: local-git
spec:
  selector: {app: git-server}
  ports:
    - {name: http, port: 8080, targetPort: http}
