# Argo CD, trimmed to what one cluster needs: no Dex, no notifications, one replica each.
configs:
  params:
    server.insecure: true
  cm:
    # Reconcile every minute instead of every three; releases also trigger a hard refresh.
    timeout.reconciliation: 60s
    # Argo CD stopped assessing Application health in 1.8. Without this, the root
    # app treats a child Application as healthy the moment it exists, and sync
    # waves stop meaning "wait for the operator before installing what needs it".
    resource.customizations.health.argoproj.io_Application: |
      hs = {}
      hs.status = "Progressing"
      hs.message = ""
      if obj.status ~= nil and obj.status.health ~= nil then
        hs.status = obj.status.health.status
        if obj.status.health.message ~= nil then
          hs.message = obj.status.health.message
        end
      end
      return hs

dex:
  enabled: false
notifications:
  enabled: false

controller:
  resources:
    requests: {cpu: 250m, memory: 384Mi}
    limits: {memory: 1Gi}
repoServer:
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {memory: 512Mi}
server:
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {memory: 256Mi}
applicationSet:
  resources:
    requests: {cpu: 10m, memory: 32Mi}
    limits: {memory: 128Mi}
redis:
  resources:
    requests: {cpu: 10m, memory: 32Mi}
    limits: {memory: 128Mi}
