{{- $fn := include "ga.fullname" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fn }}-web
  labels:
    {{- include "ga.labels" . | nindent 4 }}
    {{- include "ga.selector" (dict "component" "web" "root" .) | nindent 4 }}
spec:
  replicas: {{ .Values.web.replicas }}
  selector:
    matchLabels: {{- include "ga.selector" (dict "component" "web" "root" .) | nindent 6 }}
  template:
    metadata:
      labels: {{- include "ga.selector" (dict "component" "web" "root" .) | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext: {{- include "ga.podSecurity" . | nindent 8 }}
      containers:
        - name: web
          image: "{{ .Values.image.web.repository }}:{{ .Values.image.web.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - {name: API_URL, value: "http://{{ $fn }}-api"}
          ports:
            - {name: http, containerPort: 3000}
          readinessProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 15
          resources: {{- toYaml .Values.web.resources | nindent 12 }}
          securityContext: {{- include "ga.containerSecurity" (dict "uid" 1000) | nindent 12 }}
          volumeMounts:
            - {name: next-cache, mountPath: /web/.next/cache}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: next-cache
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fn }}-web
  labels: {{- include "ga.labels" . | nindent 4 }}
spec:
  selector: {{- include "ga.selector" (dict "component" "web" "root" .) | nindent 4 }}
  ports:
    - {name: http, port: 80, targetPort: http}
