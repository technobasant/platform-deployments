{{- if .Values.migrate.enabled }}
# Schema migration before any API pod starts: an Argo CD PreSync hook, and the same
# object as a Helm pre-install/pre-upgrade hook for plain `helm install` (CI).
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "ga.fullname" . }}-migrate
  labels: {{- include "ga.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 10
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels: {{- include "ga.selector" (dict "component" "migrate" "root" .) | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      # Service links would set GA_API_PORT=tcp://... and break the app\'s own settings.
      enableServiceLinks: false
      securityContext: {{- include "ga.podSecurity" . | nindent 8 }}
      containers:
        - name: migrate
          image: {{ include "ga.pythonImage" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - python
            - -c
            - |
              import asyncio
              from ga_api.db import make_engine, migrate
              from ga_api.settings import Settings
              async def main():
                  engine = make_engine(Settings().database_url)
                  await migrate(engine)
                  await engine.dispose()
                  print("schema ready")
              asyncio.run(main())
          env: {{- include "ga.dbEnv" . | nindent 12 }}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext: {{- include "ga.containerSecurity" (dict "uid" 10001) | nindent 12 }}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}
