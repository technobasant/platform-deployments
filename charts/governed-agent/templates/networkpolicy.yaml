{{- if .Values.networkPolicy.enabled }}
{{- $np := .Values.networkPolicy -}}
{{- $fn := include "ga.fullname" . -}}
# Ingress is denied by default; each component admits only its callers.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fn }}-default-deny-ingress
  labels: {{- include "ga.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fn }}-api
  labels: {{- include "ga.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "ga.selector" (dict "component" "api" "root" .) | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {{- include "ga.selector" (dict "component" "web" "root" .) | nindent 14 }}
        {{- range $np.apiClientNamespaces }}
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: {{ . }}}
        {{- end }}
      ports: [{port: 8080}]
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: {{ $np.monitoringNamespace }}}
      ports: [{port: 9901}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fn }}-mcp
  labels: {{- include "ga.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "ga.selector" (dict "component" "mcp" "root" .) | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {{- include "ga.selector" (dict "component" "api" "root" .) | nindent 14 }}
      ports: [{port: 8001}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fn }}-web
  labels: {{- include "ga.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "ga.selector" (dict "component" "web" "root" .) | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - ports: [{port: 3000}]
---
# CloudNativePG instances: the app, the migration job, the operator, each other.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fn }}-postgres
  labels: {{- include "ga.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {cnpg.io/cluster: {{ .Values.database.host | trimSuffix "-rw" }}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {{- include "ga.selector" (dict "component" "api" "root" .) | nindent 14 }}
        - podSelector:
            matchLabels: {{- include "ga.selector" (dict "component" "migrate" "root" .) | nindent 14 }}
        - podSelector:
            matchLabels: {cnpg.io/cluster: {{ .Values.database.host | trimSuffix "-rw" }}}
      ports: [{port: 5432}]
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: cnpg-system}
        - podSelector:
            matchLabels: {cnpg.io/cluster: {{ .Values.database.host | trimSuffix "-rw" }}}
      ports: [{port: 8000}, {port: 5432}]
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: {{ $np.monitoringNamespace }}}
      ports: [{port: 9187}]
{{- end }}
