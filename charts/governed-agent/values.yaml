# Images are built from governed-agent's v0.1.0 tag and loaded into the cluster.
# Tags are immutable; nothing here ever says "latest".
image:
  python:
    repository: governed-agent-python
    tag: v0.1.0
  web:
    repository: governed-agent-web
    tag: v0.1.0
  envoy:
    repository: envoyproxy/envoy
    tag: v1.36.2
  pullPolicy: IfNotPresent

# The deterministic stand-in model shipped with governed-agent, so platform
# measurements do not depend on a GPU or a model server.
model: demo

database:
  # CloudNativePG names: <cluster>-rw is the read-write service, <cluster>-app the
  # secret holding the application role.
  host: ga-pg-rw
  port: 5432
  name: app
  secretName: ga-pg-app

otel:
  enabled: true
  endpoint: http://otel-collector-opentelemetry-collector.observability.svc:4318

api:
  # Every api replica runs the outbox worker; 1 s (the app's default) times five
  # replicas is five idle polls a second against PostgreSQL.
  outboxPollSeconds: 5
  replicas: 5
  # Free text recorded on the pod template; changing it ships a new revision of the
  # same build (used to measure a healthy rollout).
  revisionNote: initial
  # A 100m request made the HPA's 70% target 70m, which a pod passes while it is
  # still importing; scale-outs during a rollout then started more cold pods.
  resources:
    requests: {cpu: 250m, memory: 192Mi}
    limits: {cpu: "1", memory: 512Mi}
  # Fault injection happens in the Envoy sidecar, not in governed-agent's code. Any
  # non-zero value changes the pod template, so it ships as a new Rollout revision.
  fault:
    abortPercent: 0
    abortStatus: 500
    delayPercent: 0
    delayMs: 0
  envoyResources:
    requests: {cpu: 50m, memory: 48Mi}
    limits: {cpu: 500m, memory: 128Mi}
  canary:
    steps:
      - setWeight: 20
      - pause: {duration: 60s}
      - setWeight: 50
      - pause: {duration: 60s}
    analysis:
      interval: 15s
      # Skip a new pod's first requests (cold imports, connection pool warm-up),
      # and look at a 30 s window so they age out of it quickly.
      initialDelay: 30s
      window: 30s
      # Abort on the first failed measurement; a canary is cheap to retry.
      failureLimit: 0
      count: 12
      errorRateMax: 0.05
      p95MaxMs: 500
  hpa:
    enabled: true
    minReplicas: 5
    maxReplicas: 8
    cpuUtilization: 70
  pdb:
    minAvailable: 3

mcp:
  replicas: 2
  resources:
    requests: {cpu: 50m, memory: 192Mi}
    limits: {cpu: 500m, memory: 512Mi}
  pdb:
    minAvailable: 1

web:
  replicas: 2
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {cpu: 500m, memory: 384Mi}
  pdb:
    minAvailable: 1

migrate:
  enabled: true

monitoring:
  podMonitor: true
  scrapeInterval: 5s

networkPolicy:
  enabled: true
  # Namespaces allowed to call the API (the load generator runs here).
  apiClientNamespaces: [load]
  monitoringNamespace: monitoring
